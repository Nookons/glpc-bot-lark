name: tests

# 800+ офлайн-проверок бота: полный прогон на каждый push и pull request.
#
# Сеть к Telegram, Supabase и Lark здесь не нужна и не используется:
# наборы подменяют внешние вызовы заглушками, а `test_live_test_harness`
# поднимает локальный стенд на 127.0.0.1:8877 (PostgREST + Storage + Lark
# в памяти). Секреты в CI не передаются — их отсутствие проверено.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: offline suites (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установить Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          # 🔴 **`requirements-dev.txt`, а не `requirements.txt`:** два набора
          # используют `pytest`, и без него `unittest discover` падал на
          # импорте (`ModuleNotFoundError`), а прогон был красным на каждом
          # push. В образ прода pytest не нужен — поэтому отдельный файл.
          pip install -r requirements-dev.txt

      # unittest-наборы: 6 файлов, 264 проверки (на 04.10.2026).
      #
      # Числа здесь — справка, а не проверка: они уже устаревали (было
      # написано «5 файлов, 214 проверок», когда стало 6 и 264). Чтобы
      # справка не расходилась с фактом, ниже есть шаг, который считает
      # наборы и падает, если файл не подхватился.
      #
      # Порядок специально алфавитный (как у `discover` по умолчанию) —
      # он исторически и ломал изоляцию конфигурации, поэтому пусть будет
      # зафиксирован явно. Дополнительно прогоняем сам discover: именно так
      # наборы и запускаются вместе.
      - name: unittest-наборы (discover)
        working-directory: tests
        run: python -m unittest discover -p "test_*.py" -v

      # `test_telegram_offline` — скрипт, а не unittest: печатает итог
      # «ВСЕ ПРОВЕРКИ ПРОЙДЕНЫ» и возвращает 0/1. Отдельный шаг, потому что
      # `discover` его не собирает (внутри нет `unittest.TestCase`).
      #
      # 🔴 **СОСТОЯНИЕ НА 07.11.2026: набор КРАСНЫЙ — падают десятки проверок.**
      # Они были **скрыты**: до установки pytest CI падал раньше, на импорте
      # двух unittest-наборов, и до этого шага просто не доходил. Проверено на
      # коммите `ae3c2af` (до правок 07.11): тот же набор падений, то есть это
      # не регрессия, а давно разошедшийся стенд. Примеры: удаление сообщения
      # о смене статуса, привязка фото к последней записи, текст сменного
      # отчёта, очередь роботов, `/reg` из чужого чата.
      #
      # 🔴 **Шаг не отключать и не помечать `continue-on-error`:** он и есть
      # единственный признак, что стенд разошёлся. Разбирать отдельной задачей.
      - name: Офлайн-набор бота (скрипт)
        run: python tests/test_telegram_offline.py

      # Сторож против «молча выпавшего» набора: `discover` не падает, если
      # файл перестал собираться из-за ошибки импорта в нём — он просто
      # находит меньше тестов. Проверяем, что собрано не меньше, чем было.
      - name: Наборы собрались полностью
        working-directory: tests
        run: |
          collected=$(python -m unittest discover -p "test_*.py" 2>&1 | grep -oE "Ran [0-9]+" | grep -oE "[0-9]+")
          echo "собрано проверок: $collected"
          if [ "$collected" -lt 264 ]; then
            echo "🔴 собрано меньше 264 — часть наборов не подключилась"
            exit 1
          fi
